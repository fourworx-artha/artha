<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artha — User Flow Reference</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222535;
    --surface3: #2a2e42;
    --border: #2e3347;
    --accent: #6c8ef5;
    --accent2: #9b6cf5;
    --green: #4ade80;
    --amber: #fbbf24;
    --red: #f87171;
    --cyan: #22d3ee;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --text3: #64748b;
    --read-bg: #1a2a1a;
    --read-border: #2d4a2d;
    --write-bg: #1a1a2a;
    --write-border: #2d2d5a;
    --update-bg: #2a1a1a;
    --update-border: #5a2d2d;
    --delete-bg: #2a1a1a;
    --delete-border: #7a2d2d;
    --tag-init: #1e3a5f;
    --tag-auth: #3b1f5e;
    --tag-dev: #1f4a3b;
    --tag-chore: #3b3b1f;
    --tag-pay: #3b1f1f;
    --tag-rew: #1f3b3b;
    --tag-fin: #2d1f3b;
    --tag-tax: #1f2d3b;
    --tag-eco: #3b2d1f;
    --tag-mem: #1f3b2d;
    --tag-bak: #3b2d2d;
    --tag-score: #2d3b1f;
    --tag-real: #1f1f3b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 28px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-top {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 14px;
  }

  h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--text);
  }

  .header-meta {
    font-size: 12px;
    color: var(--text3);
  }

  /* ── Filter bar ── */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }

  .filter-label {
    font-size: 11px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-right: 4px;
  }

  .filter-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }

  .filter-btn:hover { border-color: var(--accent); color: var(--text); }

  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  .filter-btn.all.active {
    background: var(--surface3);
    border-color: var(--text2);
    color: var(--text);
  }

  /* ── Search ── */
  .search-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }

  .search-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 13px;
    width: 260px;
    outline: none;
  }

  .search-input::placeholder { color: var(--text3); }
  .search-input:focus { border-color: var(--accent); }

  .result-count {
    font-size: 12px;
    color: var(--text3);
  }

  /* ── Main layout ── */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  /* ── Category section ── */
  .category-section {
    margin-bottom: 32px;
  }

  .category-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .category-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text2);
  }

  .category-count {
    font-size: 11px;
    color: var(--text3);
    background: var(--surface2);
    padding: 2px 7px;
    border-radius: 10px;
  }

  /* ── Flow card ── */
  .flow-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
    overflow: hidden;
    transition: border-color 0.15s ease;
  }

  .flow-card:hover { border-color: var(--surface3); }
  .flow-card.expanded { border-color: var(--accent); }

  .flow-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    cursor: pointer;
    user-select: none;
  }

  .flow-id {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 3px 8px;
    border-radius: 5px;
    background: var(--surface3);
    color: var(--text3);
    white-space: nowrap;
    font-family: 'SF Mono', 'Consolas', monospace;
  }

  .flow-name {
    font-weight: 600;
    color: var(--text);
    flex: 1;
    font-size: 14px;
  }

  .flow-step-count {
    font-size: 11px;
    color: var(--text3);
    white-space: nowrap;
  }

  .chevron {
    width: 16px;
    height: 16px;
    color: var(--text3);
    transition: transform 0.2s ease;
    flex-shrink: 0;
  }

  .flow-card.expanded .chevron { transform: rotate(180deg); }

  /* ── Flow body ── */
  .flow-body {
    display: none;
    padding: 0 16px 16px;
  }

  .flow-card.expanded .flow-body { display: block; }

  /* Trigger */
  .trigger-block {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--text2);
  }

  .trigger-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text3);
    display: block;
    margin-bottom: 4px;
  }

  /* Steps pipeline */
  .steps-container {
    position: relative;
  }

  .steps-container::before {
    content: '';
    position: absolute;
    left: 19px;
    top: 28px;
    bottom: 28px;
    width: 2px;
    background: var(--border);
  }

  .step {
    display: flex;
    gap: 14px;
    margin-bottom: 8px;
    position: relative;
  }

  .step-num {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--surface3);
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--text2);
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }

  .step-content {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    min-height: 38px;
  }

  .step-desc {
    color: var(--text);
    margin-bottom: 8px;
    line-height: 1.5;
    font-size: 13px;
  }

  .step-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    font-family: 'SF Mono', 'Consolas', monospace;
    white-space: nowrap;
  }

  .tag-file {
    background: var(--surface3);
    color: var(--text2);
    border: 1px solid var(--border);
  }

  .tag-func {
    background: #1a2a3a;
    color: var(--cyan);
    border: 1px solid #1e3a4a;
  }

  .tag-table {
    background: #2a1a3a;
    color: #c084fc;
    border: 1px solid #3a1a5a;
  }

  .tag-op {
    font-weight: 700;
  }

  .tag-op-read {
    background: var(--read-bg);
    color: var(--green);
    border: 1px solid var(--read-border);
  }

  .tag-op-write {
    background: var(--write-bg);
    color: var(--accent);
    border: 1px solid var(--write-border);
  }

  .tag-op-update {
    background: var(--update-bg);
    color: var(--amber);
    border: 1px solid var(--update-border);
  }

  .tag-op-delete {
    background: var(--delete-bg);
    color: var(--red);
    border: 1px solid var(--delete-border);
  }

  .tag-ext {
    background: #1a2a1a;
    color: #86efac;
    border: 1px solid #2a4a2a;
  }

  /* Edge cases + failure points */
  .meta-section {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 14px;
  }

  @media (max-width: 700px) {
    .meta-section { grid-template-columns: 1fr; }
  }

  .meta-block {
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
  }

  .meta-block-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .meta-block-edge {
    background: #1e2a1a;
    border: 1px solid #2d4a2d;
  }

  .meta-block-edge .meta-block-title { color: #86efac; }

  .meta-block-fail {
    background: #2a1a1a;
    border: 1px solid #4a2d2d;
  }

  .meta-block-fail .meta-block-title { color: var(--red); }

  .meta-item {
    display: flex;
    gap: 6px;
    margin-bottom: 5px;
    color: var(--text2);
    line-height: 1.4;
  }

  .meta-item::before { content: '→'; color: var(--text3); flex-shrink: 0; }

  .meta-block-fail .meta-item::before { content: '⚠'; color: var(--red); }

  .meta-empty {
    color: var(--text3);
    font-style: italic;
  }

  /* ── No results ── */
  .no-results {
    text-align: center;
    padding: 60px 20px;
    color: var(--text3);
    display: none;
  }

  /* ── Legend ── */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px 28px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    color: var(--text2);
  }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 2px;
  }

  /* ── Expand all controls ── */
  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .section-title {
    font-size: 12px;
    color: var(--text3);
  }

  .ctrl-btns {
    display: flex;
    gap: 8px;
  }

  .ctrl-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.12s ease;
  }

  .ctrl-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Category color dots */
  .cat-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .cat-App-Initialization { background: #6c8ef5; }
  .cat-Authentication { background: #9b6cf5; }
  .cat-Device-Management { background: #4ade80; }
  .cat-Chore-Management { background: #fbbf24; }
  .cat-Payslip-Engine { background: #f87171; }
  .cat-Reward-Store { background: #22d3ee; }
  .cat-Financial-Operations { background: #c084fc; }
  .cat-Tax-Fund { background: #60a5fa; }
  .cat-Economic-Controls { background: #fb923c; }
  .cat-Member-Management { background: #34d399; }
  .cat-Backup-Restore { background: #f472b6; }
  .cat-Credit-Score { background: #a3e635; }
  .cat-Realtime-Sync { background: #818cf8; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>Artha — User Flow Reference</h1>
    <span class="header-meta">35 flows · 13 categories</span>
  </div>
  <div class="filter-bar">
    <span class="filter-label">Filter</span>
    <button class="filter-btn all active" onclick="filterCategory('all')">All</button>
    <button class="filter-btn" onclick="filterCategory('App Initialization')">App Init</button>
    <button class="filter-btn" onclick="filterCategory('Authentication')">Auth</button>
    <button class="filter-btn" onclick="filterCategory('Device Management')">Devices</button>
    <button class="filter-btn" onclick="filterCategory('Chore Management')">Chores</button>
    <button class="filter-btn" onclick="filterCategory('Payslip Engine')">Payslip</button>
    <button class="filter-btn" onclick="filterCategory('Reward Store')">Rewards</button>
    <button class="filter-btn" onclick="filterCategory('Financial Operations')">Finance</button>
    <button class="filter-btn" onclick="filterCategory('Tax Fund')">Tax Fund</button>
    <button class="filter-btn" onclick="filterCategory('Economic Controls')">Economic</button>
    <button class="filter-btn" onclick="filterCategory('Member Management')">Members</button>
    <button class="filter-btn" onclick="filterCategory('Backup & Restore')">Backup</button>
    <button class="filter-btn" onclick="filterCategory('Credit Score')">Credit</button>
    <button class="filter-btn" onclick="filterCategory('Realtime Sync')">Realtime</button>
  </div>
  <div class="search-bar">
    <input type="text" class="search-input" placeholder="Search flows, files, functions..." oninput="searchFlows(this.value)" />
    <span class="result-count" id="result-count"></span>
  </div>
</header>

<div class="legend">
  <span class="legend-item"><span class="legend-dot" style="background:#4ade80"></span>read</span>
  <span class="legend-item"><span class="legend-dot" style="background:#6c8ef5"></span>write</span>
  <span class="legend-item"><span class="legend-dot" style="background:#fbbf24"></span>update</span>
  <span class="legend-item"><span class="legend-dot" style="background:#f87171"></span>delete</span>
  <span class="legend-item"><span class="legend-dot" style="background:#22d3ee;border-radius:2px"></span>function call</span>
  <span class="legend-item"><span class="legend-dot" style="background:#c084fc;border-radius:2px"></span>DB table</span>
  <span class="legend-item"><span class="legend-dot" style="background:#86efac;border-radius:2px"></span>external service</span>
  <span class="legend-item"><span class="legend-dot" style="background:#64748b;border-radius:2px"></span>file</span>
</div>

<main>
  <div class="controls">
    <span class="section-title" id="visible-label">Showing all 35 flows</span>
    <div class="ctrl-btns">
      <button class="ctrl-btn" onclick="expandAll()">Expand all</button>
      <button class="ctrl-btn" onclick="collapseAll()">Collapse all</button>
    </div>
  </div>

  <div id="flows-container"></div>
  <div class="no-results" id="no-results">No flows match your search.</div>
</main>

<script>
const flows = [
  {
    id: "INIT-001",
    name: "App startup — brand-new install (no family)",
    category: "App Initialization",
    trigger: "User opens the PWA for the first time on a device with no family in the database",
    steps: [
      { step: 1, description: "React mounts App component. BrowserRouter and FamilyProvider wrap the tree.", files: ["src/main.jsx", "src/App.jsx", "src/context/FamilyContext.jsx"] },
      { step: 2, description: "FamilyProvider calls loadFamily() on mount. Fetches family, members, chores, rewards from Supabase. All return empty; sets loading=false.", files: ["src/context/FamilyContext.jsx", "src/db/operations.js", "src/db/supabase.js"], functions: ["loadFamily()", "getFamily()", "getMembers()", "getChores()", "getRewards()"], db_tables: ["families", "members", "chores", "rewards"], db_operation: "read", external_services: ["Supabase"] },
      { step: 3, description: "DeviceGate reads localStorage('artha_device_claim') — null. Runs getDeviceClaim() + checkFamilyExists() in parallel.", files: ["src/App.jsx", "src/db/operations.js"], functions: ["readCachedClaim()", "getDeviceClaim()", "checkFamilyExists()"], db_tables: ["device_claims", "families"], db_operation: "read", external_services: ["Supabase"] },
      { step: 4, description: "checkFamilyExists() returns false. DeviceGate sets screen='onboarding'. Renders <Onboarding />.", files: ["src/App.jsx", "src/views/onboarding/Onboarding.jsx"] }
    ],
    edge_cases: ["Supabase unavailable: loadFamily() catches error, app still shows onboarding (DeviceGate catches error → sets screen='join')", "Family row exists but no device claim: routes to JoinFamily instead of Onboarding"],
    failure_points: ["VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY missing → all DB calls fail silently"]
  },
  {
    id: "INIT-002",
    name: "App startup — returning device with cached claim",
    category: "App Initialization",
    trigger: "User opens the PWA on a device that has previously claimed a family membership",
    steps: [
      { step: 1, description: "DeviceGate calls readCachedClaim() synchronously — reads localStorage('artha_device_claim'). Returns claim object.", files: ["src/App.jsx"], functions: ["readCachedClaim()"] },
      { step: 2, description: "Claim found. DeviceGate sets screen='ready' immediately (no async check). DeviceContext.Provider wraps tree with claim value.", files: ["src/App.jsx", "src/context/DeviceContext.jsx"] },
      { step: 3, description: "FamilyProvider loadFamily() runs in parallel — loads family data from Supabase.", files: ["src/context/FamilyContext.jsx", "src/db/operations.js"], functions: ["loadFamily()"], external_services: ["Supabase"] },
      { step: 4, description: "AuthProvider mounts. Reads localStorage('artha_member_id'). If found, calls getMember() to restore session.", files: ["src/context/AuthContext.jsx", "src/db/operations.js"], functions: ["getMember()"], db_tables: ["members"], db_operation: "read", external_services: ["Supabase"] },
      { step: 5, description: "If no saved member ID: renders PinAuth. If member restored: navigates to /parent or /child/home based on role.", files: ["src/auth/PinAuth.jsx"] }
    ],
    edge_cases: ["Cached claim JSON is corrupt: readCachedClaim() returns null, falls through to async check", "Member ID in localStorage but member deleted from DB: getMember() returns null, session not restored, shows PinAuth"],
    failure_points: ["localStorage cleared by browser: device must be reclaimed"]
  },
  {
    id: "INIT-003",
    name: "Family creation (Onboarding)",
    category: "App Initialization",
    trigger: "First-time parent completes the 4-step onboarding wizard",
    steps: [
      { step: 1, description: "Parent fills in family name (step 0), selects role/avatar (step 1), enters name (step 2), sets and confirms 4-digit PIN (step 3).", files: ["src/views/onboarding/Onboarding.jsx"] },
      { step: 2, description: "On final step submit: hashPin(rawPin) called via Web Crypto SHA-256 with 'artha:' salt prefix.", files: ["src/auth/pinUtils.js"], functions: ["hashPin()"] },
      { step: 3, description: "createFamily({ familyName, memberName, avatar, pinHash }) called. Inserts families row (with FAMILY_ID constant and DEFAULT_CONFIG), then inserts first parent member row. Auto-claims this device as the founding parent device (upserts device_claims).", files: ["src/db/operations.js", "src/utils/constants.js"], functions: ["createFamily()", "getOrCreateDeviceId()"], db_tables: ["families", "members", "device_claims"], db_operation: "write", external_services: ["Supabase"] },
      { step: 4, description: "createFamily() returns { memberId, deviceId }. Onboarding calls onComplete(claim). DeviceGate saves claim to localStorage and sets screen='ready'. FamilyContext reloads.", files: ["src/views/onboarding/Onboarding.jsx", "src/App.jsx", "src/context/FamilyContext.jsx"] },
      { step: 5, description: "App shows PinAuth. Parent selects their avatar and enters PIN to log in for the first time.", files: ["src/auth/PinAuth.jsx"] }
    ],
    edge_cases: ["PIN confirmation mismatch: Onboarding shows error, does not submit", "Supabase insert fails: error displayed inline, family row may be partially created. Seed checks member count > 0 before inserting, so retry is safe."],
    failure_points: ["FAMILY_ID hardcoded as 'dev-family-001' — second family creation would overwrite the first"]
  },
  {
    id: "AUTH-001",
    name: "PIN login",
    category: "Authentication",
    trigger: "User selects their avatar on PinAuth and enters 4-digit PIN",
    steps: [
      { step: 1, description: "PinAuth mounts. If device claim has a memberId, useEffect auto-selects that member from the members list.", files: ["src/auth/PinAuth.jsx"], functions: ["useDevice()"] },
      { step: 2, description: "User selects avatar (or it's pre-selected). AvatarGrid renders all members filtered by device claim.", files: ["src/auth/PinAuth.jsx"] },
      { step: 3, description: "User enters 4 digits. On 4th digit: handleSubmit() fires automatically. Calls login(memberId, rawPin) from AuthContext.", files: ["src/auth/PinAuth.jsx", "src/context/AuthContext.jsx"], functions: ["login()"] },
      { step: 4, description: "login() fetches the member from Supabase via getMember(), then calls verifyPin(rawPin, member.pin). verifyPin re-hashes and compares.", files: ["src/context/AuthContext.jsx", "src/db/operations.js", "src/auth/pinUtils.js"], functions: ["getMember()", "verifyPin()", "hashPin()"], db_tables: ["members"], db_operation: "read", external_services: ["Supabase"] },
      { step: 5, description: "PIN correct: login() sets currentMember in AuthContext state, writes member.id to localStorage('artha_member_id'). Returns true.", files: ["src/context/AuthContext.jsx"] },
      { step: 6, description: "PinAuth calls navigate('/parent') for parents or navigate('/child/home') for children.", files: ["src/auth/PinAuth.jsx"] },
      { step: 7, description: "ParentShell or ChildShell renders. Checks currentMember.role — redirects to '/' if role mismatch.", files: ["src/App.jsx"] }
    ],
    edge_cases: ["Wrong PIN: login() returns false. PinAuth clears pin state, shows 'Wrong PIN' error.", "Member not found (deleted after device claim): shows 'Member not found' error.", "Device claimed to specific member: other members not shown in avatar grid"],
    failure_points: ["Supabase offline during PIN verification: getMember() throws, login() catches and shows 'Something went wrong'"]
  },
  {
    id: "AUTH-002",
    name: "Logout",
    category: "Authentication",
    trigger: "User taps the logout button (available in parent More screen or child settings)",
    steps: [
      { step: 1, description: "logout() called from AuthContext. Sets currentMember = null, removes localStorage('artha_member_id').", files: ["src/context/AuthContext.jsx"], functions: ["logout()"] },
      { step: 2, description: "ParentShell or ChildShell detects currentMember is null, navigates to '/' (PinAuth).", files: ["src/App.jsx"] }
    ],
    edge_cases: [],
    failure_points: []
  },
  {
    id: "DEV-001",
    name: "New device claims family via invite code",
    category: "Device Management",

// ── Category grouping ──────────────────────────────────────────────────
const categoryOrder = [
  "App Initialization", "Authentication", "Device Management",
  "Chore Management", "Payslip Engine", "Reward Store",
  "Financial Operations", "Tax Fund", "Economic Controls",
  "Member Management", "Backup & Restore", "Credit Score", "Realtime Sync"
];

const catSlug = s => s.replace(/[^a-zA-Z]/g, '-');

let activeCategory = 'all';
let searchQuery = '';

function getOpClass(op) {
  if (!op) return '';
  const o = op.toLowerCase();
  if (o.includes('delete')) return 'tag-op-delete';
  if (o.includes('update')) return 'tag-op-update';
  if (o.includes('write') || o.includes('insert')) return 'tag-op-write';
  if (o.includes('read')) return 'tag-op-read';
  return 'tag-op-read';
}

function renderStep(s) {
  const tags = [];
  if (s.db_operation) {
    tags.push(`<span class="tag tag-op ${getOpClass(s.db_operation)}">${s.db_operation}</span>`);
  }
  (s.db_tables || []).forEach(t => tags.push(`<span class="tag tag-table">${t}</span>`));
  (s.functions || []).forEach(f => tags.push(`<span class="tag tag-func">${f}</span>`));
  (s.external_services || []).forEach(e => tags.push(`<span class="tag tag-ext">${e}</span>`));
  (s.files || []).forEach(f => tags.push(`<span class="tag tag-file">${f.split('/').pop()}</span>`));

  return `
    <div class="step">
      <div class="step-num">${s.step}</div>
      <div class="step-content">
        <div class="step-desc">${s.description}</div>
        ${tags.length ? `<div class="step-tags">${tags.join('')}</div>` : ''}
      </div>
    </div>`;
}

function renderFlow(flow) {
  const steps = flow.steps.map(renderStep).join('');
  const edges = flow.edge_cases.length
    ? flow.edge_cases.map(e => `<div class="meta-item">${e}</div>`).join('')
    : `<div class="meta-empty">None documented</div>`;
  const fails = flow.failure_points.length
    ? flow.failure_points.map(f => `<div class="meta-item">${f}</div>`).join('')
    : `<div class="meta-empty">None documented</div>`;
  const hasMeta = flow.edge_cases.length > 0 || flow.failure_points.length > 0;

  return `
    <div class="flow-card" id="flow-${flow.id}" data-category="${flow.category}" data-search="${(flow.name + ' ' + flow.trigger + ' ' + flow.id + ' ' + (flow.steps.map(s => (s.files||[]).join(' ') + ' ' + (s.functions||[]).join(' ')).join(' '))).toLowerCase()}">
      <div class="flow-header" onclick="toggleFlow('flow-${flow.id}')">
        <div class="flow-id">${flow.id}</div>
        <div class="flow-name">${flow.name}</div>
        <div class="flow-step-count">${flow.steps.length} step${flow.steps.length !== 1 ? 's' : ''}</div>
        <svg class="chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 6l4 4 4-4"/>
        </svg>
      </div>
      <div class="flow-body">
        <div class="trigger-block">
          <span class="trigger-label">Trigger</span>
          ${flow.trigger}
        </div>
        <div class="steps-container">${steps}</div>
        ${hasMeta ? `
        <div class="meta-section">
          <div class="meta-block meta-block-edge">
            <div class="meta-block-title">Edge Cases</div>
            ${edges}
          </div>
          <div class="meta-block meta-block-fail">
            <div class="meta-block-title">Failure Points</div>
            ${fails}
          </div>
        </div>` : ''}
      </div>
    </div>`;
}

function renderAll() {
  const container = document.getElementById('flows-container');
  container.innerHTML = '';

  const filtered = flows.filter(f => {
    const catMatch = activeCategory === 'all' || f.category === activeCategory;
    const searchMatch = !searchQuery || f.dataset_search_text
      || f._searchText.includes(searchQuery.toLowerCase());
    return catMatch && searchMatch;
  });

  // Pre-compute search text
  flows.forEach(f => {
    if (!f._searchText) {
      f._searchText = (f.id + ' ' + f.name + ' ' + f.trigger + ' ' + f.category + ' ' +
        f.steps.map(s => (s.description || '') + ' ' + (s.files || []).join(' ') + ' ' + (s.functions || []).join(' ') + ' ' + (s.db_tables || []).join(' ')).join(' ')).toLowerCase();
    }
  });

  const visibleFlows = flows.filter(f => {
    const catMatch = activeCategory === 'all' || f.category === activeCategory;
    const searchMatch = !searchQuery || f._searchText.includes(searchQuery.toLowerCase());
    return catMatch && searchMatch;
  });

  if (visibleFlows.length === 0) {
    document.getElementById('no-results').style.display = 'block';
    document.getElementById('visible-label').textContent = 'No flows match';
    return;
  }
  document.getElementById('no-results').style.display = 'none';

  const total = visibleFlows.length;
  document.getElementById('visible-label').textContent = total === flows.length
    ? `Showing all ${total} flows`
    : `Showing ${total} of ${flows.length} flows`;

  if (activeCategory !== 'all') {
    container.innerHTML = visibleFlows.map(renderFlow).join('');
  } else {
    categoryOrder.forEach(cat => {
      const catFlows = visibleFlows.filter(f => f.category === cat);
      if (catFlows.length === 0) return;
      const slug = catSlug(cat);
      container.innerHTML += `
        <div class="category-section" id="cat-${slug}">
          <div class="category-header">
            <div class="cat-dot cat-${slug}"></div>
            <div class="category-title">${cat}</div>
            <div class="category-count">${catFlows.length} flow${catFlows.length !== 1 ? 's' : ''}</div>
          </div>
          ${catFlows.map(renderFlow).join('')}
        </div>`;
    });
  }
}

function toggleFlow(id) {
  const card = document.getElementById(id);
  card.classList.toggle('expanded');
}

function filterCategory(cat) {
  activeCategory = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  const label = cat === 'all' ? 'All' : cat;
  const btn = Array.from(document.querySelectorAll('.filter-btn')).find(b => b.textContent.trim() === (cat === 'all' ? 'All' : (() => {
    const map = {
      'App Initialization': 'App Init',
      'Authentication': 'Auth',
      'Device Management': 'Devices',
      'Chore Management': 'Chores',
      'Payslip Engine': 'Payslip',
      'Reward Store': 'Rewards',
      'Financial Operations': 'Finance',
      'Tax Fund': 'Tax Fund',
      'Economic Controls': 'Economic',
      'Member Management': 'Members',
      'Backup & Restore': 'Backup',
      'Credit Score': 'Credit',
      'Realtime Sync': 'Realtime'
    };
    return map[cat] || cat;
  })()));
  if (btn) btn.classList.add('active');
  renderAll();
}

function searchFlows(q) {
  searchQuery = q.trim();
  renderAll();
}

function expandAll() {
  document.querySelectorAll('.flow-card').forEach(c => c.classList.add('expanded'));
}

function collapseAll() {
  document.querySelectorAll('.flow-card').forEach(c => c.classList.remove('expanded'));
}

// Init
flows.forEach(f => {
  f._searchText = (f.id + ' ' + f.name + ' ' + f.trigger + ' ' + f.category + ' ' +
    f.steps.map(s => (s.description || '') + ' ' + (s.files || []).join(' ') + ' ' + (s.functions || []).join(' ') + ' ' + (s.db_tables || []).join(' ')).join(' ')).toLowerCase();
});

renderAll();
</script>
